name: Weekly Monday Recruitment Dashboard Update

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국 시간 09:00 KST)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 기능 추가

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run verification script
      run: python verify_jobs.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.html ergonomics.html update_history.json update_history.md
        # 변경 사항이 있을 때만 커밋 및 푸시 진행
        if ! git diff --cached --quiet; then
          git commit -m "chore(auto): weekly recruitment portal verification [skip ci]"
          git push origin main
        else
          echo "No changes detected. Skipping commit."
        fi
