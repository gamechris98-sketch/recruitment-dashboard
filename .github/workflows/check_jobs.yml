name: Auto Recruitment Tracker

on:
  schedule:
    # 하루에 두 번 자동 실행 (UTC 기준 12:00, 00:00 -> 한국 시간 21시, 09시)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 수동 실행용 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run script
      run: python recruitment_alert.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add alert_history.json recruitment_dashboard.html recruitment_notices.md
        git commit -m "Auto-update recruitment dashboard" || exit 0
        git push
